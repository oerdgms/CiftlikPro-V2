
name: CiftlikPro Windows Kurulum

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Derleme araçlarını kur
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1

      - name: Python kaynak kontrolü
        shell: pwsh
        run: |
          python -m py_compile app/server.py
          python -m py_compile app/desktop_launcher.py

      - name: Windows uygulamasını oluştur
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean CiftlikPro.spec
          if (!(Test-Path "dist\CiftlikPro\CiftlikPro.exe")) {
            throw "CiftlikPro.exe oluşturulamadı."
          }

      - name: Uygulamayı çalıştır ve giriş sayfasını test et
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "$pwd\dist\CiftlikPro\CiftlikPro.exe" `
            -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:8948/login" `
                  -UseBasicParsing `
                  -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match "ÇiftlikPro") {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) {
              throw "ÇiftlikPro giriş sayfası açılamadı."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Inno Setup ile kurulum EXE'si oluştur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if (!(Test-Path "release\CiftlikPro_Setup.exe")) {
            throw "CiftlikPro_Setup.exe oluşturulamadı."
          }

      - name: SHA-256 oluştur
        shell: pwsh
        run: |
          $hash = (Get-FileHash "release\CiftlikPro_Setup.exe" -Algorithm SHA256).Hash
          "CiftlikPro_Setup.exe  SHA256: $hash" | Out-File `
            "release\SHA256.txt" -Encoding utf8

      - name: Kurulum dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: CiftlikPro-Windows-Setup
          path: |
            release/CiftlikPro_Setup.exe
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30
