name: CiftlikPro Enterprise V3.9.4 Akilli Rasyon Dengeleme Windows Kurulum

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derleme aracını kur
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1 cryptography pillow==11.3.0

      - name: Kaynak kod kontrolü
        shell: pwsh
        run: |
          python -m py_compile app/server.py
          python -m py_compile app/desktop_launcher.py
          python -c "import sys; sys.path.insert(0, 'app'); import server; assert server.APP_VERSION == '3.9.4'; print('VERSION_OK:', server.APP_VERSION)"

      - name: Kaynak sunucuyu başlat ve sayfaları test et
        shell: pwsh
        run: |
          $testData = Join-Path $env:RUNNER_TEMP "CiftlikProSourceTestData"
          $stdout = Join-Path $env:RUNNER_TEMP "ciftlikpro-source-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "ciftlikpro-source-stderr.log"
          New-Item -ItemType Directory -Force -Path $testData | Out-Null
          $env:CIFTLIKPRO_DATA_DIR = $testData
          $env:PYTHONUNBUFFERED = "1"

          $process = Start-Process python `
            -ArgumentList "-u", "app/server.py" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          try {
            $ready = $false
            $lastError = ""
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) {
                $lastError = "Kaynak sunucu erken kapandı. Çıkış kodu: $($process.ExitCode)"
                break
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8953/license" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and
                    $response.Content -match "ÇiftlikPro" -and
                    $response.Content -match "Aktivasyon") {
                  $ready = $true
                  break
                }
                $lastError = "HTTP yanıtı geldi fakat beklenen V3.1 metni bulunamadı. Durum: $($response.StatusCode)"
              } catch {
                $lastError = $_.Exception.Message
              }
            }

            if (-not $ready) {
              Write-Host "===== KAYNAK SUNUCU STDOUT ====="
              if (Test-Path $stdout) { Get-Content $stdout -ErrorAction SilentlyContinue }
              Write-Host "===== KAYNAK SUNUCU STDERR ====="
              if (Test-Path $stderr) { Get-Content $stderr -ErrorAction SilentlyContinue }
              throw "Kaynak sunucu testi başarısız: $lastError"
            }

            Write-Host "Kaynak sunucu ve V3.7 aktivasyon sayfası testi başarılı."
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            try { Wait-Process -Id $process.Id -Timeout 15 -ErrorAction SilentlyContinue } catch {}
            Start-Sleep -Seconds 2
            for ($attempt = 1; $attempt -le 8; $attempt++) {
              try {
                if (Test-Path $testData) { Remove-Item -Recurse -Force $testData -ErrorAction Stop }
                break
              } catch {
                if ($attempt -eq 8) { Write-Warning "Geçici kaynak test klasörü temizlenemedi: $($_.Exception.Message)" }
                else { Start-Sleep -Seconds 1 }
              }
            }
          }

      - name: Windows uygulamasını oluştur
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean CiftlikPro.spec
          if (!(Test-Path "dist\CiftlikPro\CiftlikPro.exe")) {
            throw "CiftlikPro.exe oluşturulamadı."
          }

      - name: Paketlenmiş uygulamayı başlat ve giriş sayfasını test et
        shell: pwsh
        run: |
          $testData = Join-Path $env:RUNNER_TEMP "CiftlikProExeTestData"
          New-Item -ItemType Directory -Force -Path $testData | Out-Null
          $env:CIFTLIKPRO_DATA_DIR = $testData

          $process = Start-Process -FilePath "$pwd\dist\CiftlikPro\CiftlikPro.exe" -PassThru
          try {
            $ready = $false
            $lastError = ""
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) {
                $lastError = "Paketlenmiş uygulama erken kapandı. Çıkış kodu: $($process.ExitCode)"
                break
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8953/license" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and
                    $response.Content -match "ÇiftlikPro" -and
                    $response.Content -match "Aktivasyon") {
                  $ready = $true
                  break
                }
                $lastError = "HTTP yanıtı geldi fakat beklenen V3.1 metni bulunamadı. Durum: $($response.StatusCode)"
              } catch {
                $lastError = $_.Exception.Message
              }
            }

            if (-not $ready) {
              Write-Host "Test veri klasörü: $testData"
              Get-ChildItem -Recurse $testData -ErrorAction SilentlyContinue | Format-Table FullName,Length,LastWriteTime
              throw "Paketlenmiş uygulama testi başarısız: $lastError"
            }

            Write-Host "Paketlenmiş V3.7 uygulama testi başarılı."
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            try { Wait-Process -Id $process.Id -Timeout 15 -ErrorAction SilentlyContinue } catch {}
            Start-Sleep -Seconds 2
            for ($attempt = 1; $attempt -le 8; $attempt++) {
              try {
                if (Test-Path $testData) { Remove-Item -Recurse -Force $testData -ErrorAction Stop }
                break
              } catch {
                if ($attempt -eq 8) { Write-Warning "Geçici EXE test klasörü temizlenemedi: $($_.Exception.Message)" }
                else { Start-Sleep -Seconds 1 }
              }
            }
          }

      - name: Inno Setup kurulum dosyasını oluştur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

          $setup = "release\CiftlikPro_Enterprise_V3_9_4_Akilli_Rasyon_Dengeleme_Setup.exe"
          if (!(Test-Path $setup)) {
            throw "Kurulum EXE dosyası oluşturulamadı."
          }

      - name: SHA-256 özeti oluştur
        shell: pwsh
        run: |
          $setup = "release\CiftlikPro_Enterprise_V3_9_4_Akilli_Rasyon_Dengeleme_Setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "CiftlikPro_Enterprise_V3_9_4_Akilli_Rasyon_Dengeleme_Setup.exe  SHA256: $hash" |
            Out-File "release\SHA256.txt" -Encoding utf8

      - name: Windows kurulum paketini yükle
        uses: actions/upload-artifact@v4
        with:
          name: CiftlikPro-Enterprise-V3.9.4-Lisans-Uygulama-Koruma-Windows-Setup
          path: |
            release/CiftlikPro_Enterprise_V3_9_4_Akilli_Rasyon_Dengeleme_Setup.exe
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30
