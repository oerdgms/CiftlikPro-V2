name: CiftlikPro Enterprise V3.0.2 Stable Hotfix Windows Kurulum

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derleme aracını kur
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1

      - name: Kaynak kod kontrolü
        shell: pwsh
        run: |
          python -m py_compile app/server.py
          python -m py_compile app/desktop_launcher.py

      - name: Windows uygulamasını oluştur
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean CiftlikPro.spec
          if (!(Test-Path "dist\CiftlikPro\CiftlikPro.exe")) {
            throw "CiftlikPro.exe oluşturulamadı."
          }

      - name: Uygulamayı başlat ve giriş sayfasını test et
        shell: pwsh
        run: |
          $testData = Join-Path $env:RUNNER_TEMP "CiftlikProTestData"
          New-Item -ItemType Directory -Force -Path $testData | Out-Null
          $env:CIFTLIKPRO_DATA_DIR = $testData

          $process = Start-Process `
            -FilePath "$pwd\dist\CiftlikPro\CiftlikPro.exe" `
            -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:8953/login" `
                  -UseBasicParsing `
                  -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and
                    $response.Content -match "ÇiftlikPro" -and
                    $response.Content -match "V3.0") {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) {
              throw "ÇiftlikPro giriş sayfası açılamadı."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Inno Setup kurulum dosyasını oluştur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

          $setup = "release\CiftlikPro_Enterprise_V3_0_1_Stable_Setup.exe"
          if (!(Test-Path $setup)) {
            throw "Kurulum EXE dosyası oluşturulamadı."
          }

      - name: SHA-256 özeti oluştur
        shell: pwsh
        run: |
          $setup = "release\CiftlikPro_Enterprise_V3_0_1_Stable_Setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "CiftlikPro_Enterprise_V3_0_1_Stable_Setup.exe  SHA256: $hash" |
            Out-File "release\SHA256.txt" -Encoding utf8

      - name: Windows kurulum paketini yükle
        uses: actions/upload-artifact@v4
        with:
          name: CiftlikPro-Enterprise-V3.0.2-Stable-Hotfix-Windows-Setup
          path: |
            release/CiftlikPro_Enterprise_V3_0_1_Stable_Setup.exe
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30