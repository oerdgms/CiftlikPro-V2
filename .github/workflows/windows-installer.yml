name: CiftlikPro Windows Kurulum

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derleme araclarini kur
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1 cryptography pillow openpyxl pypdf reportlab

      - name: Kaynak kod kontrolu
        shell: pwsh
        run: |
          python -m py_compile app/server.py
          python -m py_compile app/desktop_launcher.py
          python -c "import sys; sys.path.insert(0, 'app'); import server; assert server.APP_VERSION == '3.9.21 DEV5.1'; print('VERSION_OK:', server.APP_VERSION)"

      - name: Kaynak sunucu smoke testi
        shell: pwsh
        run: |
          $testData = Join-Path $env:RUNNER_TEMP "CiftlikProSourceTestData"
          $stdout = Join-Path $env:RUNNER_TEMP "ciftlikpro-source-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "ciftlikpro-source-stderr.log"
          New-Item -ItemType Directory -Force -Path $testData | Out-Null
          $env:CIFTLIKPRO_DATA_DIR = $testData
          $env:PYTHONUNBUFFERED = "1"

          $process = Start-Process python -ArgumentList "-u", "app/server.py" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            $lastError = ""
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) {
                $lastError = "Kaynak sunucu erken kapandi. Cikis kodu: $($process.ExitCode)"
                break
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8953/license" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match "ÇiftlikPro") {
                  $ready = $true
                  break
                }
                $lastError = "HTTP yaniti beklenen icerigi vermedi. Durum: $($response.StatusCode)"
              } catch {
                $lastError = $_.Exception.Message
              }
            }

            if (-not $ready) {
              Write-Host "===== KAYNAK STDOUT ====="
              if (Test-Path $stdout) { Get-Content $stdout -ErrorAction SilentlyContinue }
              Write-Host "===== KAYNAK STDERR ====="
              if (Test-Path $stderr) { Get-Content $stderr -ErrorAction SilentlyContinue }
              throw "Kaynak sunucu testi basarisiz: $lastError"
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Windows uygulamasini olustur
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean CiftlikPro.spec
          if (!(Test-Path "dist\CiftlikPro\CiftlikPro.exe")) {
            throw "CiftlikPro.exe olusturulamadi."
          }

      - name: Paketlenmis uygulama smoke testi
        shell: pwsh
        run: |
          $testData = Join-Path $env:RUNNER_TEMP "CiftlikProExeTestData"
          New-Item -ItemType Directory -Force -Path $testData | Out-Null
          $env:CIFTLIKPRO_DATA_DIR = $testData

          $process = Start-Process -FilePath "$pwd\dist\CiftlikPro\CiftlikPro.exe" -PassThru
          try {
            $ready = $false
            $lastError = ""
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) {
                $lastError = "Paketlenmis uygulama erken kapandi. Cikis kodu: $($process.ExitCode)"
                break
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8953/license" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match "ÇiftlikPro") {
                  $ready = $true
                  break
                }
                $lastError = "HTTP yaniti beklenen icerigi vermedi. Durum: $($response.StatusCode)"
              } catch {
                $lastError = $_.Exception.Message
              }
            }
            if (-not $ready) { throw "Paketlenmis uygulama testi basarisiz: $lastError" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Inno Setup kurulum dosyasini olustur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if (!(Test-Path "release\CiftlikPro_Enterprise_V3_9_21_DEV5_1_Setup.exe")) {
            throw "Kurulum EXE dosyasi olusturulamadi."
          }

      - name: SHA-256 ozeti olustur
        shell: pwsh
        run: |
          $setup = "release\CiftlikPro_Enterprise_V3_9_21_DEV5_1_Setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "CiftlikPro_Enterprise_V3_9_21_DEV5_1_Setup.exe  SHA256: $hash" | Out-File "release\SHA256.txt" -Encoding utf8

      - name: Windows kurulum paketini yukle
        uses: actions/upload-artifact@v4
        with:
          name: CiftlikPro-Enterprise-V3.9.21-DEV5.1-Windows-Setup
          path: |
            release/CiftlikPro_Enterprise_V3_9_21_DEV5_1_Setup.exe
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30
